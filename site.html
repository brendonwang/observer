<!doctype html>
<html lang="en" data-demo="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf8">
<meta name="color-scheme" content="light">
<meta name="description" content="Observer - see what your projects are doing.">
<title>Observer</title>
<style nonce="__NONCE__">
/* Keep this aligned with Observer's original minimalist-ui palette and typography. */
:root {
  --bg: #fafaf8;
  --surface: #fff;
  --ink: #252724;
  --muted: #777b75;
  --quiet: #9a9f99;
  --line: #e6e8e3;
  --hover: #f3f4f0;
  --selected: #eff1ed;
  --green: #39775a;
  --red: #9f5a51;
  --sans: "SF Pro Display", "Helvetica Neue", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
  --mono: "SF Mono", Menlo, Consolas, monospace;
}
*, *::before, *::after {box-sizing: border-box}
html {background: var(--bg); -webkit-text-size-adjust: 100%}
body {margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased}
button, input, select {font: inherit}
button {cursor: pointer}
button:disabled {opacity: .5; cursor: default}
a {color: inherit; text-underline-offset: 3px}
a:hover {color: var(--green)}
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {outline: 2px solid var(--green); outline-offset: 3px}
button:active:not(:disabled) {transform: translateY(1px)}
[hidden] {display: none !important}
::selection {background: #e3ece3}
.sr-only {position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0}
.skip {position: absolute; left: -9999px; top: 0}
.skip:focus {left: 12px; top: 12px; z-index: 20; background: var(--surface); padding: 9px}

.shell {width: 100%; max-width: 1136px; margin: auto; padding: 0 clamp(22px,4.5vw,54px) 70px}
.topbar {height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line)}
.brand {font-size: 19px; font-weight: 700; letter-spacing: -.072em}
.brand span {color: var(--green)}
.top-actions {display: flex; align-items: center; gap: 22px}
.connection {display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap}
.signal {width: 7px; height: 7px; display: inline-block; flex: none; border-radius: 50%; background: var(--green)}
.signal.off {background: #b2a8a3}
.action {min-height: 40px; border: 0; padding: 8px 0; background: transparent; color: var(--muted); font-size: 12px}
.action:hover {color: var(--ink)}

.intro {padding: 43px 0 30px; border-bottom: 1px solid var(--line)}
.intro h1 {font: 400 43px/1.05 var(--serif); letter-spacing: -.055em; margin: 0}
.intro p {margin: 12px 0 0; font-size: 13px; color: var(--muted)}
.stats {display: flex; align-items: baseline; gap: clamp(25px,5.8vw,76px); border-bottom: 1px solid var(--line); padding: 25px 0 27px}
.stat {min-width: 0; display: flex; align-items: baseline; gap: 9px}
.stat-num {font-size: 22px; letter-spacing: -.04em; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums}
.stat-label {font-size: 12px; color: var(--muted); white-space: nowrap}

.section-head {display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; padding: 31px 0 7px}
.section-head h2 {font-size: 14px; font-weight: 650; letter-spacing: -.015em; margin: 0}
.tabs {display: inline-flex; gap: 24px; border-bottom: 1px solid var(--line)}
.tab {position: relative; background: transparent; border: 0; color: var(--muted); font-size: 12px; padding: 9px 0 12px}
.tab:hover, .tab.active {color: var(--ink)}
.tab.active {font-weight: 650}
.tab.active::after {content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink)}
.tools {display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 13px 0 9px}
.search-wrap {display: flex; align-items: center; flex: 1; min-width: 175px; max-width: 420px; height: 42px; border-bottom: 1px solid var(--line)}
.search-wrap:focus-within {border-color: #819c87}
.search {border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 13px; width: 100%; padding: 10px 2px; min-width: 0}
.search::placeholder {color: var(--quiet)}
.source {height: 39px; min-width: 115px; max-width: 175px; padding: 0 2px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--muted); font-size: 12px}
.notice {color: #956400; font-size: 12px; min-height: 17px; margin: 4px 0 0}

.stack {display: block; min-width: 0}
.project {border-top: 1px solid var(--line); padding: 3px 0 10px}
.project:first-child {margin-top: 5px}
.project-head {display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 63px; padding: 14px 4px 10px}
.project-name {font-size: 15px; font-weight: 650; letter-spacing: -.025em; overflow-wrap: anywhere}
.project-secondary {font-size: 12px; color: var(--muted); margin-top: 2px}
.pill {border-radius: 999px; padding: 3px 9px; background: var(--hover); color: var(--muted); font-size: 10px; letter-spacing: .015em; flex: none; white-space: nowrap}
.pill.active {color: #346538; background: #edf3ec}
.pill.attention {color: #9f2f2d; background: #fdebec}
.activity {display: grid; grid-template-columns: 58px minmax(0,1fr) auto; align-items: center; gap: 18px; min-height: 72px; width: 100%; text-align: left; padding: 11px 8px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink); transition: background .17s}
.activity:hover, .activity:focus-visible {background: var(--hover)}
.activity:active:not(:disabled) {transform: none}
.activity-icon {display: block; width: 53px; color: var(--quiet); font: 500 10px/1.45 var(--mono); letter-spacing: -.04em; text-transform: uppercase}
.activity-copy {display: block; min-width: 0}
.activity-title {font-size: 13px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere}
.activity-desc {font-size: 12px; margin-top: 4px; color: var(--muted)}
.activity-state {font-size: 11px; color: var(--muted); white-space: nowrap}
.activity-state.ok {color: var(--green)}
.activity-state.fail {color: var(--red)}
.activity-state.running {color: var(--green)}
.empty {font-size: 13px; color: var(--muted); padding: 55px 6px; border-top: 1px solid var(--line)}
.footer {display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; padding-top: 28px; margin-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px}
.footer a {text-decoration: none}
.footer a:hover {color: var(--ink)}

/* Flat, editorial side sheet instead of a raised modal. */
.overlay {position: fixed; inset: 0; z-index: 15; background: rgba(37,39,36,.18)}
.dialog {position: absolute; top: 0; right: 0; bottom: 0; width: min(100%,510px); overflow-y: auto; background: var(--bg); border-left: 1px solid var(--line); padding: 30px clamp(25px,3vw,42px) 55px}
.dialog-head {display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); padding-bottom: 27px}
.dialog h2 {font: 400 clamp(24px,2.7vw,30px)/1.2 var(--serif); letter-spacing: -.04em; margin: 0; overflow-wrap: anywhere}
.x {background: transparent; border: 0; padding: 0 3px; color: var(--muted); font-size: 13px; min-height: 32px; white-space: nowrap}
.x:hover {color: var(--ink)}
.detail-meta {margin-top: 13px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere}
.result-title {font-size: 13px; font-weight: 650; margin: 28px 0 14px}
.output {font: 13px/1.8 var(--sans); color: #454943; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 400px; overflow: auto}
.events {padding: 0; margin: 0; list-style: none}
.events li {display: flex; align-items: baseline; justify-content: space-between; gap: 15px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding: 11px 0}
.events time {flex: none; color: var(--quiet)}
.events li span {overflow-wrap: anywhere}

.auth-screen {min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 35px 22px}
.auth-card {width: 100%; max-width: 340px}
.auth-card .brand {display: block; margin-bottom: 54px}
.auth-card h1 {font: 400 37px/1.08 var(--serif); letter-spacing: -.05em; margin: 0 0 29px}
.field-label {display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px}
.password {width: 100%; height: 46px; background: var(--surface); border: 1px solid #d9ded7; border-radius: 5px; padding: 0 12px; outline: 0}
.password:focus {border-color: var(--green)}
.primary {width: 100%; height: 46px; margin-top: 14px; border: 0; border-radius: 5px; background: var(--ink); color: white; font-size: 13px; font-weight: 600}
.primary:hover {background: #424841}
.auth-error {min-height: 17px; margin-top: 12px; font-size: 12px; color: var(--red)}
@media (max-width: 760px) {
  .shell {padding: 0 23px 45px}
  .topbar {height: 64px}
  .top-actions {gap: 16px}
  .intro {padding: 37px 0 27px}
  .intro h1 {font-size: 40px}
  .stats {gap: 17px; flex-wrap: wrap; padding: 22px 0}
  .stat {gap: 6px}
  .stat-num {font-size: 20px}
  .stat-label {font-size: 11px}
  .section-head {padding-top: 24px}
  .tabs {gap: 19px}
  .tools {gap: 12px}
  .search-wrap {max-width: none}
  .project-head {min-height: 59px}
  .activity {grid-template-columns: 44px minmax(0,1fr) auto; gap: 11px; padding: 13px 3px; min-height: 73px}
  .activity-icon {width: 43px; font-size: 9px}
  .activity-state {font-size: 10px}
  .dialog {width: 100%; border-left: 0; padding: 29px 23px 50px}
}
@media (max-width: 380px) {
  .top-actions {gap: 10px}
  .stats {gap: 14px}
  .stat {flex-direction: column; gap: 1px}
  .source {max-width: 125px}
}
@media (prefers-reduced-motion: reduce) {*,*::before,*::after {transition: none !important; scroll-behavior: auto !important; animation: none !important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to workspace</a>
<div class="auth-screen" id="login">
  <div class="auth-card">
    <div class="brand">observer<span>.</span></div>
    <h1>Sign in</h1>
    <form id="login-form">
      <label class="field-label" for="password">Password</label>
      <input class="password" id="password" type="password" autocomplete="current-password" required>
      <button class="primary" id="login-button" type="submit">Continue</button>
      <div id="login-error" class="auth-error" role="alert"></div>
    </form>
  </div>
</div>
<div class="shell" id="app" hidden>
  <header class="topbar">
    <div class="brand">observer<span>.</span></div>
    <div class="top-actions">
      <div class="connection" role="status"><span id="status-dot" class="signal"></span><span id="connection">Connecting</span></div>
      <button class="action" id="refresh" type="button">Refresh</button>
      <button class="action" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <main id="main">
    <section class="intro" aria-label="Overview">
      <h1>Workspace</h1>
      <p>Activity across your projects.</p>
    </section>
    <div class="stats" aria-label="Activity summary">
      <div class="stat"><span id="running" class="stat-num">0</span><span class="stat-label">Running</span></div>
      <div class="stat"><span id="completed" class="stat-num">0</span><span class="stat-label">Completed</span></div>
      <div class="stat"><span id="attention" class="stat-num">0</span><span class="stat-label">Needs attention</span></div>
    </div>
    <div class="section-head">
      <h2 id="heading">Projects</h2>
      <nav class="tabs" aria-label="View">
        <button class="tab active" type="button" data-tab="projects" aria-pressed="true">Projects</button>
        <button class="tab" type="button" data-tab="activity" aria-pressed="false">Activity</button>
      </nav>
    </div>
    <div class="tools">
      <label class="search-wrap"><span class="sr-only">Search projects and activity</span><input id="search" class="search" type="search" placeholder="Search activity" aria-label="Search projects and activity"></label>
      <label class="sr-only" for="source">Filter by source</label>
      <select id="source" class="source" aria-label="Filter by source"><option value="">All sources</option></select>
    </div>
    <p id="notice" class="notice" role="status" hidden></p>
    <div id="projects" class="stack" aria-label="Project activity"></div>
    <footer class="footer"><span id="footnote"></span><a href="https://github.com/brendonwang/observer" target="_blank" rel="noopener noreferrer">GitHub</a></footer>
  </main>
</div>
<div id="overlay" class="overlay" hidden>
  <aside role="dialog" aria-modal="true" aria-labelledby="dialog-title" class="dialog" tabindex="-1">
    <div class="dialog-head">
      <div><h2 id="dialog-title"></h2><div id="dialog-meta" class="detail-meta"></div></div>
      <button id="close" class="x" type="button" aria-label="Close details">Close</button>
    </div>
    <div id="detail-content"></div>
  </aside>
</div>
<script nonce="__NONCE__">
(() => {
  'use strict';
  const demo = document.documentElement.dataset.demo === 'true';
  const $ = id => document.getElementById(id);
  const el = (tag, className = '', text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  let state = {threads: [], devices: []};
  let view = 'projects', query = '', source = '', selected = null, refreshing = false;
  let loggedIn = demo, lastFocus = null;
  const now = Date.now(), minutes = n => now - n * 60_000;
  const demoState = {
    devices: [{id: 'demo', last_seen_at: now}], threads: [
      {id: 'demo-agent', project: 'observer', source: 'Codex', title: 'Implement notifications', status: 'working', updated_at: minutes(4), events: [{kind: 'start', label: 'Agent started', at: minutes(4)}]},
      {id: 'demo-test', project: 'observer', source: 'Terminal', title: 'npm test', status: 'completed', updated_at: minutes(8), final_response: '24 tests passed.', events: [{kind: 'complete', label: 'Tests passed', at: minutes(8)}]},
      {id: 'demo-server', project: 'observer', source: 'Service', title: 'Development server', status: 'completed', updated_at: minutes(1), final_response: 'localhost:3000 - healthy', events: []},
      {id: 'demo-ci', project: 'saco-judge', source: 'GitHub Actions', title: 'CI pipeline', status: 'interrupted', updated_at: minutes(12), events: [{kind: 'warning', label: 'CI failed', at: minutes(12)}]},
      {id: 'demo-prod', project: 'saco-judge', source: 'Deployment', title: 'Production deployment', status: 'completed', updated_at: minutes(22), final_response: 'Production healthy', events: []},
    ],
  };

  function ago(value) {
    const t = Number(value);
    if (!Number.isFinite(t) || t <= 0) return '';
    const elapsed = Math.max(0, Math.floor((Date.now() - t) / 1000));
    if (elapsed < 60) return 'now';
    if (elapsed < 3600) return Math.floor(elapsed / 60) + 'm ago';
    if (elapsed < 86400) return Math.floor(elapsed / 3600) + 'h ago';
    return Math.floor(elapsed / 86400) + 'd ago';
  }
  function online() {
    return demo || state.devices.some(device => Date.now() - Number(device.last_seen_at) < 120000);
  }
  function status(item) {
    if (item.status === 'working' && !online()) return 'quiet';
    return item.status || 'unknown';
  }
  function statusLabel(item) {
    const current = status(item);
    if (current === 'interrupted') return /codex|claude|pi/i.test(item.source || '') ? 'Stopped' : 'Failed';
    return ({completed:'Completed', working:'Running', failed:'Failed', quiet:'Idle', unknown:'Unknown'})[current] || 'Unknown';
  }
  function sourceLabel(item) {
    const label = String(item.source || '').toLowerCase();
    if (label.includes('claude')) return 'Claude';
    if (label.includes('codex')) return 'Codex';
    if (label === 'terminal') return 'Shell';
    if (label === 'service') return 'Server';
    if (label.includes('github')) return 'CI';
    if (label.includes('deploy')) return 'Deploy';
    return String(item.source || 'Task').slice(0, 10);
  }
  function statusStyle(item) {
    const s = status(item);
    if (s === 'completed') return 'ok';
    if (s === 'failed' || s === 'interrupted') return 'fail';
    if (s === 'working') return 'running';
    return '';
  }
  function activityRow(item) {
    const button = el('button', 'activity');
    button.type = 'button';
    button.setAttribute('aria-label', (item.title || 'Untitled') + ' - ' + statusLabel(item));
    const label = el('span', 'activity-icon', sourceLabel(item));
    const body = el('span', 'activity-copy');
    body.append(el('span', 'activity-title', item.title || 'Untitled activity'));
    body.append(el('div', 'activity-desc', (item.source || 'Custom') + ' \u00b7 ' + ago(item.updated_at)));
    const stateEl = el('span', 'activity-state ' + statusStyle(item), statusLabel(item));
    button.append(label, body, stateEl);
    button.addEventListener('click', () => details(item.id, button));
    return button;
  }
  function matches(item) {
    if (source && item.source !== source) return false;
    return !query || [item.title, item.project, item.source].join(' ').toLowerCase().includes(query);
  }
  function grouped(items) {
    const groups = new Map();
    for (const item of items) {
      const name = item.project && item.project !== 'Unknown project' ? item.project : 'Other activity';
      if (!groups.has(name)) groups.set(name, []);
      groups.get(name).push(item);
    }
    return [...groups].sort((a, b) => Math.max(...b[1].map(t => t.updated_at || 0)) - Math.max(...a[1].map(t => t.updated_at || 0)));
  }
  function setNotice(message) {
    $('notice').textContent = message;
    $('notice').hidden = !message;
  }
  function render() {
    const live = online();
    $('connection').textContent = demo ? 'Demo' : live ? 'Connected' : state.devices.length ? 'Offline' : 'Waiting';
    $('status-dot').classList.toggle('off', !live);
    $('running').textContent = state.threads.filter(t => status(t) === 'working').length;
    $('completed').textContent = state.threads.filter(t => status(t) === 'completed').length;
    $('attention').textContent = state.threads.filter(t => ['interrupted','failed'].includes(status(t))).length;
    const select = $('source');
    const names = [...new Set(state.threads.map(t => t.source).filter(Boolean))].sort();
    if (select.dataset.key !== JSON.stringify(names)) {
      select.replaceChildren(new Option('All sources', ''));
      names.forEach(name => select.add(new Option(name, name)));
      select.dataset.key = JSON.stringify(names);
      select.value = names.includes(source) ? source : '';
      source = select.value;
    }
    select.hidden = names.length < 2;
    const matchesList = state.threads.filter(matches);
    const container = $('projects');
    container.replaceChildren();
    $('heading').textContent = view === 'projects' ? 'Projects' : 'Activity';
    if (!matchesList.length) {
      container.append(el('div', 'empty', state.threads.length ? 'No matching activity.' : 'No activity yet. Start an agent or track a command.'));
      return;
    }
    const groups = view === 'activity' ? [['Recent activity', [...matchesList].sort((a,b) => b.updated_at - a.updated_at)]] : grouped(matchesList);
    for (const [name, items] of groups) {
      const section = el('section', 'project');
      const head = el('div', 'project-head');
      const heading = el('div');
      heading.append(el('div', 'project-name', name));
      heading.append(el('div', 'project-secondary', items.length + (items.length === 1 ? ' activity' : ' activities')));
      const attention = items.some(t => ['interrupted','failed'].includes(status(t)));
      const active = items.some(t => status(t) === 'working');
      const label = attention ? 'Needs attention' : active ? 'Active' : 'Idle';
      const badge = el('span', 'pill ' + (attention ? 'attention' : active ? 'active' : ''), label);
      head.append(heading, badge);
      section.append(head);
      for (const item of [...items].sort((a,b) => b.updated_at - a.updated_at)) section.append(activityRow(item));
      container.append(section);
    }
  }
  function details(id, focusNode = null) {
    const item = state.threads.find(t => t.id === id);
    if (!item) return;
    if ($('overlay').hidden) lastFocus = focusNode || document.activeElement;
    selected = id;
    $('dialog-title').textContent = item.title || 'Activity';
    $('dialog-meta').textContent = [item.project || 'Other', item.source || 'Custom', statusLabel(item), ago(item.updated_at)].join(' \u00b7 ');
    const content = $('detail-content');
    content.replaceChildren();
    if (item.final_response) {
      content.append(el('div', 'result-title', 'Result'));
      content.append(el('div', 'output', item.final_response));
    }
    content.append(el('div', 'result-title', 'Activity'));
    const events = Array.isArray(item.events) ? item.events : [];
    const list = el('ol', 'events');
    for (const event of [...events].reverse()) {
      const row = el('li');
      row.append(el('span', '', event.label || event.kind || 'Event'));
      row.append(el('time', '', ago(event.at)));
      list.append(row);
    }
    if (!events.length) list.append(el('li', '', 'No events recorded.'));
    content.append(list);
    $('overlay').hidden = false;
    if (focusNode) $('close').focus();
  }
  function closeDetails() {
    selected = null;
    $('overlay').hidden = true;
    if (lastFocus && lastFocus.isConnected) lastFocus.focus();
    lastFocus = null;
  }
  async function refresh() {
    if (refreshing) return;
    refreshing = true;
    try {
      if (demo) state = demoState;
      else {
        const response = await fetch('/api/state', {credentials: 'same-origin', cache: 'no-store'});
        if (response.status === 401) {
          loggedIn = false;
          $('app').hidden = true;
          $('login').hidden = false;
          if (!$('overlay').hidden) closeDetails();
          return;
        }
        if (!response.ok) throw Error('Unable to update activity.');
        state = await response.json();
        if (!state || !Array.isArray(state.threads) || !Array.isArray(state.devices)) throw Error('Invalid server response.');
        loggedIn = true;
      }
      $('app').hidden = false;
      $('login').hidden = true;
      setNotice('');
      render();
      if (selected) details(selected);
    } catch (error) {
      if (loggedIn) setNotice('Could not update activity. Showing the last received data.');
      else { $('login').hidden = false; $('login-error').textContent = 'Could not connect. Try again.'; }
    } finally { refreshing = false; }
  }
  $('login-form').addEventListener('submit', async event => {
    event.preventDefault();
    const button = $('login-button');
    button.disabled = true;
    $('login-error').textContent = '';
    try {
      const response = await fetch('/api/login', {method: 'POST', credentials: 'same-origin', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password: $('password').value})});
      if (!response.ok) throw Error(response.status === 401 ? 'Incorrect password' : 'Could not sign in.');
      $('password').value = '';
      await refresh();
    } catch (error) { $('login-error').textContent = error.message; }
    finally {button.disabled = false;}
  });
  $('logout').addEventListener('click', async () => {
    $('logout').disabled = true;
    try {
      const response = await fetch('/api/logout', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:'{}'});
      if (!response.ok && response.status !== 401) throw Error('Could not sign out.');
      loggedIn = false;
      state = {threads:[],devices:[]};
      $('app').hidden = true;
      $('login').hidden = false;
      if (!$('overlay').hidden) closeDetails();
    } catch (error) {setNotice(error.message);}
    finally {$('logout').disabled = false;}
  });
  $('refresh').addEventListener('click', refresh);
  $('search').addEventListener('input', event => {query = event.target.value.toLowerCase(); render();});
  $('source').addEventListener('change', event => {source = event.target.value; render();});
  document.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => {
    view = button.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach(tab => {
      tab.classList.toggle('active', tab === button);
      tab.setAttribute('aria-pressed', String(tab === button));
    });
    render();
  }));
  $('close').addEventListener('click', closeDetails);
  $('overlay').addEventListener('click', event => {if (event.target === $('overlay')) closeDetails();});
  document.addEventListener('keydown', event => {
    if ($('overlay').hidden) return;
    if (event.key === 'Escape') {event.preventDefault(); closeDetails();}
    if (event.key === 'Tab') {
      const focusable = [...$('overlay').querySelectorAll('button:not(:disabled),a[href],input,select')].filter(node => !node.hidden);
      if (focusable.length === 0) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {event.preventDefault(); last.focus();}
      else if (!event.shiftKey && document.activeElement === last) {event.preventDefault(); first.focus();}
    }
  });
  $('footnote').textContent = demo ? 'Illustrative demo' : '';
  if (demo) {
    $('logout').hidden = true;
    $('app').hidden = false;
  }
  refresh();
  setInterval(() => {if (!document.hidden && loggedIn) void refresh();}, 12000);
})();
</script>
</body>
</html>
